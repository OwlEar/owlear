name: Build APK

# Runs free on GitHub for public repos.
# - Every push builds an APK you can download from the run's "Artifacts" box.
# - When the four OWLEAR_* signing secrets exist, that APK is signed with OwlEar's
#   permanent release key, so it installs as an update over the previous version.
# - Pushing a tag like v0.3.0 publishes a public Release page with the signed APK and
#   its SHA-256 checksum. Tags refuse to publish without the signing key, so a
#   throwaway-signed build can never reach the public again.

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # Public releases are built and published only on the public OwlEar/owlear repo,
    # where anyone can read the build log. The private dev repo still builds test APKs
    # on normal pushes, but skips version tags.
    if: github.repository == 'OwlEar/owlear' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      OWLEAR_KEYSTORE_B64: ${{ secrets.OWLEAR_KEYSTORE_B64 }}
      OWLEAR_KEYSTORE_PASSWORD: ${{ secrets.OWLEAR_KEYSTORE_PASSWORD }}
      OWLEAR_KEY_ALIAS: ${{ secrets.OWLEAR_KEY_ALIAS }}
      OWLEAR_KEY_PASSWORD: ${{ secrets.OWLEAR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Refuse to publish a release without the signing key
        if: startsWith(github.ref, 'refs/tags/v') && env.OWLEAR_KEYSTORE_B64 == ''
        run: |
          echo "::error::The OWLEAR_* signing secrets are missing. Releases must be signed with the permanent key."
          exit 1

      - name: Build signed release APK and Play bundle
        if: env.OWLEAR_KEYSTORE_B64 != ''
        run: |
          echo "$OWLEAR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          OWLEAR_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" gradle assembleRelease bundleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk owlear.apk
          cp app/build/outputs/bundle/release/app-release.aab owlear.aab

      - name: Build test APK (no signing key available, e.g. pull requests from forks)
        if: env.OWLEAR_KEYSTORE_B64 == ''
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk owlear.apk

      - name: Show signing certificate and checksum
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          echo "Using: ${APKSIGNER:-none found under $SDK}"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs owlear.apk 2>&1 | grep -iE "certificate (DN|SHA-256)" || "$APKSIGNER" verify -v --print-certs owlear.apk
          else
            echo "::warning::apksigner not found; skipping certificate printout"
          fi
          sha256sum owlear.apk > owlear.apk.sha256
          cat owlear.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: owlear-apk
          path: |
            owlear.apk
            owlear.apk.sha256

      - uses: actions/upload-artifact@v4
        if: env.OWLEAR_KEYSTORE_B64 != ''
        with:
          name: owlear-play-bundle
          path: owlear.aab

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            owlear.apk
            owlear.apk.sha256
